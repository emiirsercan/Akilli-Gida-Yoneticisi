version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: foodapp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: FoodAppDb
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodapp-backend
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=FoodAppDb;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5050
    ports:
      - "5050:5050"
    depends_on:
      - postgres
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodapp-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5050
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  postgres-data:
